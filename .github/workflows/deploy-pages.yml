name: Deploy to GitHub Pages

# Publishes the built decks to GitHub Pages at
# https://adewale.github.io/slide-maker/. Decks use routerMode: hash, so
# deep links survive reload on a plain static host with no server-side
# SPA fallback (that is why this works on Pages as well as Cloudflare).
#
# Cloudflare Workers remains a separate, manual deploy target via
# tools/deploy-cf.py; this workflow does not touch it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight deploy at a time; never cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # playwright-chromium's postinstall needs a supported Ubuntu image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Project pages live under /<repo>/, so every deck is based at
      # /slide-maker/<deck>/ and llms.txt links resolve absolutely.
      BASE_PREFIX: /slide-maker
      SITE_URL: https://adewale.github.io/slide-maker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` installs playwright-chromium, whose postinstall downloads
      # the browser. The build needs it: decks set `download: true`, so
      # `slidev build` exports a PDF at build time (and that step launches
      # Chromium). Do NOT set PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD here.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build all decks
        run: python3 tools/build.py

      # LESSONS_LEARNED #18, on the exact artifact about to be published, served
      # under the same /slide-maker/ base Pages uses.
      - name: nav-smoke every built deck
        run: node tools/nav-smoke.mjs examples/_build --base /slide-maker --all

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: examples/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
