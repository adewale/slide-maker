name: rendered-gate

# The rendered gate (LESSONS_LEARNED #9: measure the artifact, not the source).
# Slow because it builds every deck, installs Chromium, and drives a headless
# browser over every slide — so it runs on demand and weekly, not per-PR.
#
# Trigger manually from the Actions tab (workflow_dispatch), or wait for the
# weekly run. Anything per-PR that needs to be fast lives in verify.yml.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC

jobs:
  rendered:
    # Keep browser execution on the same supported image as verify/build.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build all decks
        run: npm run build

      - name: build-and-verify --rendered --mobile (desktop + mobile viewports)
        # --mobile adds iPhone SE / Pixel 7 / iPhone SE landscape. Desktop-only
        # would miss anything specific to the MobileScrollView under 640px.
        run: python3 tools/build-and-verify.py --rendered --mobile
